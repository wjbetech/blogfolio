name: Check Changelog

on:
  pull_request:
    branches:
      - master

jobs:
  check-changelog:
    # Dependabot dependency PRs skip the changelog requirement automatically
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if changelog/entries.json was modified
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q "^changelog/entries.json$"; then
            echo "✅ changelog/entries.json was updated in this PR"
            exit 0
          else
            echo "❌ changelog/entries.json was NOT updated in this PR"
            echo ""
            echo "Please update changelog/entries.json with your changes, or add the 'no-changelog' label to skip this check."
            exit 1
          fi
