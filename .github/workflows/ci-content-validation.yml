name: Content Validation CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONTENT_VALIDATION_EXTERNAL_HOSTS: developer.mozilla.org,github.com,linkedin.com,www.linkedin.com
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content metadata and links
        run: npm run validate:content

      - name: Run test suite with coverage
        run: npm run test:ci

      - name: Run production build
        run: npm run build