name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: blogfolio-staging
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CONTENT_VALIDATION_EXTERNAL_HOSTS: developer.mozilla.org,github.com,linkedin.com,www.linkedin.com
      DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_SITE_URL: https://staging.wjbeast.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:content
      - run: pnpm run test:ci
      - run: pnpm run build
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://staging.wjbeast.com
            DEPLOYMENT_ENV=staging

  deploy:
    needs: build
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: read
    env:
      BLOGFOLIO_STAGING_IMAGE_TAG: staging-${{ github.sha }}
      CLOUDFLARE_STAGING_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_TUNNEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy separate staging stack
        run: docker compose -p blogfolio-staging -f docker-compose.staging.yml up -d --pull always
      - name: Check staging app on the homelab
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ --output /dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl --fail --show-error http://127.0.0.1:3001/ --output /dev/null
