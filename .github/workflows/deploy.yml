name: Deploy to Homelab

on:
  # Trigger automatically after a successful build-and-push
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - master
  # Also allow manual deploys from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Pull & restart on homelab
    # Only run if the upstream workflow succeeded (or if triggered manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, homelab]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Restart compose services
        working-directory: ${{ secrets.DEPLOY_DIR }}
        run: docker compose up -d --pull always
