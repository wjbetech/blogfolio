name: Deploy to Homelab

on:
  # Trigger automatically after a successful build-and-push
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - master
  # Also allow manual deploys from the Actions tab
  workflow_dispatch:

concurrency:
  group: blogfolio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    name: Pull & restart on homelab
    # Only run if the upstream workflow succeeded (or if triggered manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Determine image tag
        id: image
        run: |
          # After a build-and-push run, deploy the exact commit it built
          # Images use full commit SHAs. Legacy manual dispatch
          # is rejected rather than bypassing validation.
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "Manual deployment requires an explicit validated image; use the automatic pipeline." >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}

      # Ensure a .env file exists in ~/blogfolio with the required variables:
      #   RESEND_API_KEY, CONTACT_TO_EMAIL, CLOUDFLARE_TUNNEL_TOKEN
      # The runner must be able to read these from the host environment.
      - name: Restart compose services
        working-directory: /home/will/blogfolio
        env:
          BLOGFOLIO_IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker compose --project-directory /home/will/blogfolio -f "$GITHUB_WORKSPACE/docker-compose.yml" up -d --pull always
