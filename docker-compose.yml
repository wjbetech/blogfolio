services:
  app:
    # BLOGFOLIO_IMAGE_TAG is set by deploy.yml to the exact built commit;
    # unset it (or run manually) to fall back to the latest image.
    image: ghcr.io/wjbetech/blogfolio:${BLOGFOLIO_IMAGE_TAG:-latest}
    container_name: blogfolio
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Override at runtime if needed; baked into image at build time by default.
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://wjbeast.com}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY is required}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:?CONTACT_TO_EMAIL is required}
    ports:
      # Expose only to localhost — cloudflared is the public entry point.
      - "127.0.0.1:3000:3000"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: blogfolio-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      # Generate a tunnel token at:
      # https://one.dash.cloudflare.com > Zero Trust > Networks > Tunnels
      # Then set CLOUDFLARE_TUNNEL_TOKEN in your .env.local or shell environment.
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
